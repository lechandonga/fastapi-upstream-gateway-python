[project]
name = "fastapi-upstream-gateway-python"
version = "0.1.0"
requires-python = ">=3.14.4"
dependencies = [
  "fastapi[standard]>=0.141.1",
  "httpx>=0.28.1",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s %(levelname)s %(name)s %(message)s"
pythonpath = ["."]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
